[project]
name = "media-lab"
version = "0.1.0"
description = "Local video/photo editing pipeline for short social clips, built on Kinocut"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kinocut[hyperframes,image,transcribe,stems,upscale]==1.15.1",
    "pyyaml>=6.0",
]

[project.scripts]
media-lab = "media_lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_lab"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# docs/video-agent/pipeline/ holds captured reference scripts from the punto
# edit (v1-v23), kept verbatim as a record. They are not part of the linted
# package; mypy already scopes to src+tests for the same reason.
extend-exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# rvm_infer.py runs as a subprocess in a context that has torch + the RVM
# checkout on sys.path; it is not part of the typed library surface.
exclude = ["src/media_lab/ml/rvm_infer\\.py$"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=media_lab --cov-report=term-missing -m 'not slow'"
markers = [
    "slow: real ML runs (RVM). Deselected by default; run with -m slow.",
]
